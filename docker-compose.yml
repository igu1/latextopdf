services:
  latex-pdf-service:
    build:
      context: .
      args:
        # Baked into the image as ENV PORT, so `docker run` without compose
        # still listens on the configured port.
        PORT: ${PORT:-5055}
    ports:
      # Same number on both sides: the port in .env is the port you connect to.
      #
      # 5055 rather than 5000: the portal's own ASP.NET process listens on
      # 127.0.0.1:5000, and Windows prefers the more specific address over
      # Docker's 0.0.0.0:5000 - so every request to localhost:5000 reached
      # Kestrel and was answered with a redirect to :5001, never touching this
      # service. Both bound successfully and neither reported a conflict.
      #
      # The :-default keeps the stack working on a fresh clone with no .env yet.
      - "${PORT:-5055}:${PORT:-5055}"
    environment:
      # Passed through explicitly rather than via env_file, so a missing .env is
      # not a hard error. Overrides the value baked in at build time, so a port
      # change needs no rebuild.
      PORT: ${PORT:-5055}
    volumes:
      - ./Photo/Qpbank:/app/Photo/Qpbank
